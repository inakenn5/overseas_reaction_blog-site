<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  {{ if .Description }}<meta name="description" content="{{ .Description }}">
  {{ else if site.Params.description }}<meta name="description" content="{{ site.Params.description }}">{{ end }}
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <p>本サイトはアフィリエイト広告を含みます。記事中のコメント翻訳は原文の趣旨をできる限り
    正確に伝えるよう努めていますが、正確な翻訳を保証するものではありません。</p>
    <p>&copy; {{ now.Year }} {{ site.Title }}</p>
  </footer>
</body>
</html>
