{{ define "main" }}
<h1>{{ .Title }}</h1>
<ul class="post-list">
  {{ range .Pages.ByDate.Reverse }}
  <li>
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
    {{ if .Description }}<p class="post-excerpt">{{ .Description }}</p>{{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
