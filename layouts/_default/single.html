{{ define "main" }}
<article class="post">
  {{ with .Params.categories }}<p class="post-category">{{ delimit . ", " }}</p>{{ end }}
  <h1 class="post-title">{{ .Title }}</h1>
  <p class="post-meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>
    {{ with .Params.tags }}
      <span class="post-tags">{{ range . }}<span class="tag">{{ . }}</span>{{ end }}</span>
    {{ end }}
  </p>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
