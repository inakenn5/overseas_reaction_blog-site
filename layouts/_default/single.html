{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <p class="post-meta">
    {{ .Date.Format "2006-01-02" }}
    {{ with .Params.tags }}
      {{ range . }}<span class="tag">#{{ . }}</span>{{ end }}
    {{ end }}
  </p>
  {{ if in (printf "%s" .TableOfContents) "<li>" }}
  <nav class="toc">
    <p class="toc-title">目次</p>
    {{ .TableOfContents }}
  </nav>
  {{ end }}
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
