{{ define "main" }}
<section class="post-feed">
  {{ range where site.RegularPages "Type" "posts" }}
  <article class="post-card">
    {{ with .Params.categories }}<p class="post-card-category">{{ delimit . ", " }}</p>{{ end }}
    <h2 class="post-card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    {{ if .Description }}<p class="post-card-excerpt">{{ .Description }}</p>{{ end }}
    <p class="post-card-meta">{{ .Date.Format "2006.01.02" }}</p>
  </article>
  {{ end }}
</section>
{{ end }}
